# Validate source, behavior, bundles and the npm package contents on main and PRs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read          # a forked PR needs no write access to anything

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: ^22.19.0 || >=24
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc pins legacy-peer-deps=true: the kernel's 0.1.6 workspace peer
      # closures cannot be satisfied by npm's strict mode outside the monorepo.
      # `npm ci` also runs the `prepare` script, so a broken build fails here.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
