# A pushed v* tag IS the release decision; this workflow turns it into the
# npm publish and the GitHub release page, so a tag can never again land
# without its release.
#
# Publishing is guarded the way dsh-git-branch learned to: an empty or
# truncated NPM_TOKEN fails loudly before publishing, and an `npm whoami`
# preflight distinguishes a rejected credential from a missing package, so a
# 404 after auth is never misread as a permission problem.
#
# The release body is committed, not local: .github/releases/<tag>.md is
# checked out with the tag and becomes the release notes verbatim. A tag
# without that file fails before npm is touched, because the plugin market
# renders this body verbatim and generated notes on a rebase-merged history
# are a single compare link.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # .npmrc pins legacy-peer-deps=true (see ci.yml); `npm ci` also runs the
      # `prepare` script, so a broken build fails before publish.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Guard the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::secret NPM_TOKEN is not set — publishing is refused (set it to an npm Automation token, or a granular token with bypass-2FA enabled)"
            exit 1
          fi
          if [ "${#NPM_TOKEN}" -lt 30 ]; then
            echo "::warning::NPM_TOKEN is only ${#NPM_TOKEN} characters — an npm access token is about 40, so this looks truncated"
          fi
      - name: Preflight the npm identity
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPMRC="$(mktemp)"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
          NPM_CONFIG_USERCONFIG="$NPMRC" npm whoami --registry https://registry.npmjs.org/ > /tmp/npm-user 2>&1 \
            || { echo "::error::NPM_TOKEN was rejected by npm: $(cat /tmp/npm-user)"; exit 1; }
          echo "Authenticated on npm as: $(cat /tmp/npm-user)"
          rm -f "$NPMRC"
      # The plugin market renders the GitHub Release body verbatim, so a tag
      # without a committed body would ship a one-line compare link to users.
      # This runs before the publish: a thin body fails here, npm stays clean,
      # and re-pushing the tag after the fix is all it takes.
      - name: Verify release notes
        run: |
          set -euo pipefail
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing — every tag needs a committed release body (see AGENTS.md)"
            exit 1
          fi
          bytes="$(wc -c < "$notes" | tr -d ' ')"
          lines="$(grep -c . "$notes" || true)"
          sections="$(grep -c '^## ' "$notes" || true)"
          echo "$notes: ${bytes} bytes, ${lines} non-empty lines, ${sections} sections"
          if [ "$bytes" -lt 300 ] || [ "$lines" -lt 8 ] || [ "$sections" -lt 1 ]; then
            echo "::error::$notes is too thin — need >=300 bytes, >=8 non-empty lines and >=1 '## ' section"
            exit 1
          fi
          if ! grep -q 'Full Changelog' "$notes"; then
            echo "::error::$notes has no '**Full Changelog**' line"
            exit 1
          fi

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: /tmp/publish.npmrc
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > /tmp/publish.npmrc
          # The tag must equal v${package.json.version}: publishing a version
          # the tag does not name would divorce the release page from npm.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
          npm publish --registry https://registry.npmjs.org/ --tag latest
          rm -f /tmp/publish.npmrc
      - name: Create the GitHub release for the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=".github/releases/$GITHUB_REF_NAME.md"
          # Idempotence: a tag can be created out of band together with its
          # release (gh release create makes its own tag), which used to trip
          # this step with HTTP 422 "tag_name already exists". Re-running now
          # re-applies the committed body so stale notes cannot survive.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run must not leave stale notes behind.
            gh release edit "$GITHUB_REF_NAME" --notes-file "$BODY"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$BODY"
          fi
